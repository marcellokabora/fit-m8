<!doctype html>
<html lang="en">

<head>
	<meta charset="utf-8" />
	<meta name="viewport"
		content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
	<meta name="theme-color" content="#06170b" />
	<meta name="mobile-web-app-capable" content="yes" />
	<meta name="apple-mobile-web-app-capable" content="yes" />
	<meta name="apple-mobile-web-app-status-bar-style" content="default" />
	<meta name="apple-mobile-web-app-title" content="FIT-M8" />
	<link rel="icon" href="/favicon.png" type="image/png" />
	<link rel="apple-touch-icon" href="/icons/icon-192.png" />
	<!--
		Static fallback SEO/OG tags: this app runs with ssr=false (SPA), so social/link-preview
		crawlers (Facebook, Twitter, WhatsApp, etc.) never execute JS and never see the dynamic
		<svelte:head> tags set in +layout.svelte - they only ever see this static HTML shell.
	-->
	<title>FIT-M8</title>
	<meta name="description" content="Match people for sports activities near you" />
	<link rel="canonical" href="https://fit-m8.app/" />
	<meta property="og:type" content="website" />
	<meta property="og:site_name" content="FIT-M8" />
	<meta property="og:title" content="FIT-M8" />
	<meta property="og:description" content="Match people for sports activities near you" />
	<meta property="og:url" content="https://fit-m8.app/" />
	<meta property="og:image" content="https://fit-m8.app/icons/icon-512.png" />
	<meta property="og:image:width" content="512" />
	<meta property="og:image:height" content="512" />
	<meta name="twitter:card" content="summary" />
	<meta name="twitter:title" content="FIT-M8" />
	<meta name="twitter:description" content="Match people for sports activities near you" />
	<meta name="twitter:image" content="https://fit-m8.app/icons/icon-512.png" />
	<script type="application/ld+json">
		{
			"@context": "https://schema.org",
			"@type": "Organization",
			"name": "FIT-M8",
			"url": "https://fit-m8.app/",
			"logo": "https://fit-m8.app/icons/icon-512.png",
			"email": "info@fit-m8.app",
			"sameAs": [
				"https://www.facebook.com/profile.php?id=61594034218256",
				"https://www.instagram.com/",
				"https://www.youtube.com/"
			]
		}
	</script>
	<script type="application/ld+json">
		{
			"@context": "https://schema.org",
			"@type": "WebSite",
			"name": "FIT-M8",
			"url": "https://fit-m8.app/",
			"description": "Match people for sports activities near you"
		}
	</script>
	%sveltekit.head%
</head>


<body data-sveltekit-preload-data="hover" class="h-full">
	<div class="h-full" style="display: contents">%sveltekit.body%</div>
</body>

</html>
