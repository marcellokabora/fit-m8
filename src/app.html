<!doctype html>
<html lang="en">

<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
	<meta name="theme-color" content="#0B3692" />
	<meta name="mobile-web-app-capable" content="yes" />
	<meta name="apple-mobile-web-app-capable" content="yes" />
	<meta name="apple-mobile-web-app-status-bar-style" content="default" />
	<meta name="apple-mobile-web-app-title" content="FIT-M8" />
	<link rel="icon" href="/icons/ic_launcher.png" type="image/png" />
	<link rel="apple-touch-icon" href="/icons/mipmap-xxxhdpi/ic_launcher.png" />
	<!-- opens the connection early for the Firebase Auth relying-party lookup and GTM, both of
	     which otherwise start cold shortly after first paint and sit on the LCP critical path -->
	<link rel="preconnect" href="https://apis.google.com" crossorigin />
	<link rel="preconnect" href="https://www.googletagmanager.com" />
	<script type="application/ld+json">
		{
			"@context": "https://schema.org",
			"@type": "Organization",
			"name": "FIT-M8",
			"url": "https://fit-m8.app/",
			"logo": "https://fit-m8.app/icons/ic_launcher.png",
			"email": "info@fit-m8.app",
			"sameAs": [
				"https://www.facebook.com/fitm8apps/",
				"https://www.instagram.com/",
				"https://www.youtube.com/",
				"https://www.linkedin.com/company/fit-m8-app"
			]
		}
	</script>
	%sveltekit.head%
</head>


<body data-sveltekit-preload-data="hover" class="h-full">
	<div class="h-full" style="display: contents">%sveltekit.body%</div>
</body>

</html>
